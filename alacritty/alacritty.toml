[general]
import = []
working_directory = "~/ranger097_nixos_dotfiles"

[window]
padding = { x = 25, y = 25 }
opacity = 0.7
startup_mode = "Windowed"

[font]
#normal = { family = "Victor Mono NF", style = "Regular" }
#bold = { family = "Victor Mono NF", style = "Bold" }
#italic = { family = "Victor Mono NF", style = "Italic" }

#normal = { family = "Maple Mono NF CN", style = "Light" }
#bold = { family = "Maple Mono NF CN", style = "Bold" }
#italic = { family = "Maple Mono NF CN", style = "Bold Italic" }

#normal = { family = "JetBrainsMono Nerd Font", style = "Light" }
#bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
#italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

#normal = { family = "GeistMono NFM", style = "medium" }
#bold = { family = "GeistMono NFM", style = "Black" }
#italic = { family = "GeistMono NFM", style = "SemiBold" }

#normal = { family = "MartianMono NF", style = "Regular" }
#bold = { family = "MartianMono NF", style = "Bold" }
#italic = { family = "Iosevka NF", style = "Bold Italic" }

normal = { family = "Iosevka NF", style = "Regular" }
bold = { family = "Iosevka NF", style = "Light" }
italic = { family = "Iosevka NF", style = "SemiBold" }

offset = { x = 0, y = 15 }
size = 14.0

[colors]
transparent_background_colors = true

[colors.primary]
background = '#000000'
