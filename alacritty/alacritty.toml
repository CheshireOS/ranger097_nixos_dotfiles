[general]
import = ["kanagawa_dragon.toml"]
working_directory = "~/ranger097_nixos_dotfiles"

[window]
padding = { x = 20, y = 20 }
opacity = 1.0
startup_mode = "Windowed"

[font]
#normal = { family = "CaskaydiaCove Nerd Font Mono", style = "Regular" }
#bold = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold" }
#italic = { family = "CaskaydiaCove Nerd Font Mono", style = "SemiBold Italic" }

#normal = { family = "Victor Mono NF", style = "Regular" }
#bold = { family = "Victor Mono NF", style = "Bold" }
#italic = { family = "Victor Mono NF", style = "SemiBold Italic" }

normal = { family = "Iosevka Nerd Font Propo", style = "Regular" }
bold = { family = "Iosevka Nerd Font Propo", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "SemiBold Italic" }

#normal = { family = "Maple Mono NF CN", style = "Regular" }
#bold = { family = "Maple Mono NF CN", style = "Bold" }
#italic = { family = "Maple Mono NF CN", style = "SemiBold Italic" }

offset = { x = 0, y = 20 }
size = 16.0

[colors]
transparent_background_colors = true

