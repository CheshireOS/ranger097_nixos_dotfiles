[general]
import = ["~/ranger097_nixos_dotfiles/alacritty/kanagawa_dragon.toml"]
working_directory = "~/ranger097_nixos_dotfiles"

[window]
padding = { x = 10, y = 10 }
opacity = 0.9
startup_mode = "Windowed"

[font]
#normal = { family = "CaskaydiaCove Nerd Font Mono", style = "Regular" }
#bold = { family = "CaskaydiaCove Nerd Font Mono", style = "Bold" }
#italic = { family = "CaskaydiaCove Nerd Font Mono", style = "SemiBold Italic" }

normal = { family = "Victor Mono NF", style = "Regular" }
bold = { family = "Victor Mono NF", style = "Bold" }
italic = { family = "GohuFont uni14 Nerd Font Mono", style = "Bold" }

#normal = { family = "Maple Mono NF CN", style = "Regular" }
#bold = { family = "Maple Mono NF CN", style = "Bold" }
#italic = { family = "Maple Mono NF CN", style = "Bold Italic" }

#normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
#bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
#italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

#normal = { family = "SpaceMono Nerd Font Mono", style = "Regular" }
#bold = { family = "SpaceMono Nerd Font Mono", style = "Bold" }
#italic = { family = "SpaceMono Nerd Font Mono", style = "Bold Italic" }

offset = { x = 0, y = 0 }
size = 14.0

[colors]
transparent_background_colors = false

